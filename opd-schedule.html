<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางเวลาทำการ (OPD) - HOSPITAL CARE</title>

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style-opd.css">
</head>

<body>

    <nav>
        <div class="container">
            <div class="logo"><i class="fa-solid fa-heart-pulse"></i> HOSPITAL CARE</div>
            <div class="nav-links">
                <a href="index.html">หน้าหลัก</a>
                <a href="index.html#services">บริการ</a>
                <a href="doctors.html">ค้นหาแพทย์</a>
                <a href="opd-schedule.html" style="color: var(--primary); font-weight:bold;">ตารางเวร</a>
                <a href="index.html#contact">ติดต่อ</a>
            </div>
        </div>
    </nav>

    <div class="page-container">

        <div class="page-header">
            <div>
                <h1>ตารางเวลาทำการแผนก (OPD Schedule)</h1>
                <p style="color:#666; margin:5px 0 0 20px;">ตรวจสอบวันและเวลาทำการของแต่ละศูนย์รักษา <span
                        id="lastUpdatedText" style="color:var(--primary); font-weight: 600; margin-left: 5px;"></span>
                </p>
            </div>

            <a href="doctor-schedule.html" class="btn-doctor-search">
                <i class="fa-solid fa-user-doctor"></i> ตารางแพทย์ออกตรวจ (รายบุคคล)
            </a>
        </div>

        <div class="table-responsive">
            <table class="opd-table">
                <thead>
                    <tr>
                        <th style="width: 250px;">แผนก / วัน</th>
                        <th>จันทร์</th>
                        <th>อังคาร</th>
                        <th>พุธ</th>
                        <th>พฤหัส</th>
                        <th>ศุกร์</th>
                    </tr>
                </thead>
                <tbody id="opdTableBody">
                    <tr>
                        <td colspan="6" style="padding:50px; text-align:center;">⏳ กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script type="module">
        // 👇 เพิ่ม query, orderBy, limit เข้ามา
        import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { db } from "./js/firebase-config.js";

        window.onload = loadOPDSchedule;

        async function loadOPDSchedule() {
            const tableBody = document.getElementById('opdTableBody');

            // 🌟 ส่วนดึงเวลาอัปเดตล่าสุดจาก Audit Logs
            try {
                // ดึง log ล่าสุดมา 1 รายการ
                const logQ = query(collection(db, "audit_logs"), orderBy("timestamp", "desc"), limit(1));
                const logSnap = await getDocs(logQ);

                if (!logSnap.empty) {
                    const latestLog = logSnap.docs[0].data();
                    const dateObj = new Date(latestLog.timestamp);
                    const dateStr = dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                    const timeStr = dateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                    // แสดงผลในวงเล็บ
                    document.getElementById('lastUpdatedText').innerText = `(อัปเดตล่าสุด: ${dateStr})`;
                }
            } catch (logError) {
                console.error("ไม่สามารถดึงเวลาอัปเดตล่าสุดได้:", logError);
            }

            // 🌟 ส่วนดึงตารางแผนก
            try {
                const [deptSnap, opdSnap] = await Promise.all([
                    getDocs(collection(db, "departments")),
                    getDocs(collection(db, "opd_schedules"))
                ]);

                let depts = [];
                deptSnap.forEach(doc => {
                    if (doc.data().is_active !== false) {
                        depts.push({ id: doc.id, ...doc.data() });
                    }
                });

                const scheduleMap = {};
                opdSnap.forEach(doc => {
                    const d = doc.data();
                    if (!scheduleMap[d.dept_id]) scheduleMap[d.dept_id] = {};
                    if (!scheduleMap[d.dept_id][d.day]) scheduleMap[d.dept_id][d.day] = [];
                    scheduleMap[d.dept_id][d.day].push(d.shift);
                });

                let html = "";
                const days = ["จันทร์", "อังคาร", "พุธ", "พฤหัส", "ศุกร์"];

                const shiftConfig = {
                    '1': { label: '08:00 - 12:00', icon: '<i class="fa-regular fa-sun"></i>', cssClass: 'morning' },
                    '2': { label: '13:00 - 16:00', icon: '<i class="fa-solid fa-cloud-sun"></i>', cssClass: 'afternoon' }
                };

                if (depts.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">ไม่พบข้อมูลแผนก</td></tr>`;
                    return;
                }

                depts.forEach(dData => {
                    const dId = dData.id;

                    html += `<tr>`;
                    html += `<td>
                                <div style="display:flex; align-items:center;">
                                    <div class="dept-icon-wrapper"><i class="fa-solid ${dData.icon || 'fa-hospital'}"></i></div>
                                    ${dData.name}
                                </div>
                             </td>`;

                    days.forEach(day => {
                        const activeShifts = scheduleMap[dId]?.[day] || [];
                        html += `<td>`;

                        if (activeShifts.length > 0) {
                            activeShifts.sort();
                            activeShifts.forEach(shift => {
                                const cfg = shiftConfig[shift] || { label: shift, icon: '', cssClass: '' };
                                html += `<div class="time-badge ${cfg.cssClass}">
                                            ${cfg.icon} ${cfg.label}
                                         </div>`;
                            });
                        } else {
                            html += `<span class="inactive-dash">-</span>`;
                        }
                        html += `</td>`;
                    });

                    html += `</tr>`;
                });

                tableBody.innerHTML = html;

            } catch (error) {
                console.error("Error loading schedule:", error);
                tableBody.innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;">โหลดข้อมูลไม่สำเร็จ</td></tr>`;
            }
        }
    </script>

</body>

</html>
