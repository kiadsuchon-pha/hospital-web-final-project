<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางเวลาทำการ (OPD) - HOSPITAL CARE</title>

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style-opd.css">
</head>

<body>

    <nav>
        <div class="container">
            <div class="logo"><i class="fa-solid fa-heart-pulse"></i> HOSPITAL CARE</div>
            <div class="nav-links">
                <a href="index.html">หน้าหลัก</a>
                <a href="index.html#services">บริการ</a>
                <a href="doctors.html">ค้นหาแพทย์</a>
                <a href="opd-schedule.html" style="color: var(--primary); font-weight:bold;">ตารางเวร</a>
                <a href="index.html#contact">ติดต่อ</a>
            </div>
        </div>
    </nav>

    <div class="page-container">

        <div class="page-header">
            <div>
                <h1>ตารางเวลาทำการแผนก (OPD Schedule)</h1>
                <p style="color:#666; margin:5px 0 0 20px;">ตรวจสอบวันและเวลาทำการของแต่ละศูนย์รักษา <span
                        id="lastUpdatedText" style="color:var(--primary); font-weight: 600; margin-left: 5px;"></span>
                </p>
            </div>

            <a href="doctor-schedule.html" class="btn-doctor-search">
                <i class="fa-solid fa-user-doctor"></i> ตารางแพทย์ออกตรวจ (รายบุคคล)
            </a>
        </div>

        <div class="table-responsive">
            <table class="opd-table">
                <thead>
                    <tr>
                        <th style="width: 250px;">แผนก / วัน</th>
                        <th>จันทร์</th>
                        <th>อังคาร</th>
                        <th>พุธ</th>
                        <th>พฤหัส</th>
                        <th>ศุกร์</th>
                    </tr>
                </thead>
                <tbody id="opdTableBody">
                    <tr>
                        <td colspan="6" style="padding:50px; text-align:center;">⏳ กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script type="module">
        import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { db } from "./js/firebase-config.js";

        window.onload = loadOPDSchedule;

        async function loadOPDSchedule() {
            const tableBody = document.getElementById('opdTableBody');

            try {
                const logQ = query(collection(db, "audit_logs"), orderBy("timestamp", "desc"), limit(1));
                const logSnap = await getDocs(logQ);
                if (!logSnap.empty) {
                    const latestLog = logSnap.docs[0].data();
                    const dateObj = new Date(latestLog.timestamp);
                    const dateStr = dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                    document.getElementById('lastUpdatedText').innerText = `(อัปเดตล่าสุด: ${dateStr})`;
                }
            } catch (logError) {
                console.error("ไม่สามารถดึงเวลาอัปเดตล่าสุดได้:", logError);
            }

            try {
                const [deptSnap, opdSnap, locSnap] = await Promise.all([
                    getDocs(collection(db, "departments")),
                    getDocs(collection(db, "opd_schedules")),
                    getDocs(collection(db, "locations"))
                ]);

                const locsMap = {};
                locSnap.forEach(doc => locsMap[doc.id] = doc.data().name);

                let deptsMap = {};
                deptSnap.forEach(doc => {
                    if (doc.data().is_active !== false) {
                        deptsMap[doc.id] = doc.data();
                    }
                });

                if (Object.keys(deptsMap).length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">ไม่พบข้อมูลแผนก</td></tr>`;
                    return;
                }

                const groupedData = {};

                opdSnap.forEach(doc => {
                    const d = doc.data();
                    if (d.active === false) return;

                    const locId = d.location_id;
                    const deptId = d.dept_id;
                    const day = d.day;
                    const shift = String(d.shift);

                    if (!locId || !deptId || !deptsMap[deptId]) return;

                    if (!groupedData[locId]) {
                        groupedData[locId] = {
                            name: locsMap[locId] || "ไม่ระบุสถานที่",
                            departments: {}
                        };
                    }

                    if (!groupedData[locId].departments[deptId]) {
                        groupedData[locId].departments[deptId] = {
                            name: deptsMap[deptId].name,
                            icon: deptsMap[deptId].icon || 'fa-hospital',
                            schedules: {
                                "จันทร์": { '1': false, '2': false },
                                "อังคาร": { '1': false, '2': false },
                                "พุธ": { '1': false, '2': false },
                                "พฤหัส": { '1': false, '2': false },
                                "ศุกร์": { '1': false, '2': false }
                            }
                        };
                    }

                    if (groupedData[locId].departments[deptId].schedules[day]) {
                        groupedData[locId].departments[deptId].schedules[day][shift] = true;
                    }
                });

                let html = "";
                const days = ["จันทร์", "อังคาร", "พุธ", "พฤหัส", "ศุกร์"];

                const shiftConfig = {
                    '1': { label: '08:00 - 12:00', cssClass: 'morning' },
                    '2': { label: '13:00 - 16:00', cssClass: 'afternoon' }
                };

                for (const locId in groupedData) {
                    const location = groupedData[locId];

                    html += `<tr style="background-color: #fdfdfd;">
                                <td class="dept-cell location-empty-cell"></td>
                                <td colspan="5" style="text-align: center; font-weight: bold; color: var(--white);background: var(--primary); padding: 10px; font-size: 1.1rem; border-bottom: 2px solid #f0f4f8;">
                                    <i class="fa-solid fa-location-dot"></i> ${location.name}
                                </td>
                             </tr>`;

                    for (const deptId in location.departments) {
                        const dept = location.departments[deptId];

                        html += `<tr>`;
                        // นำไอคอนกลับมาแสดงในช่องแผนก
                        html += `<td rowspan="2" class="dept-cell" style="vertical-align: middle;">
                                    <div style="display:flex; align-items:center;">
                                        <div class="dept-icon-wrapper"><i class="fa-solid ${dept.icon}"></i></div>
                                        ${dept.name}
                                    </div>
                                 </td>`;

                        days.forEach(day => {
                            html += `<td>`;
                            if (dept.schedules[day]['1']) {
                                const cfg = shiftConfig['1'];
                                // นำ cfg.icon ออก
                                html += `<div class="time-badge ${cfg.cssClass}">${cfg.label}</div>`;
                            }
                            html += `</td>`;
                        });
                        html += `</tr>`;

                        html += `<tr class="afternoon-row">`;
                        days.forEach(day => {
                            html += `<td>`;
                            if (dept.schedules[day]['2']) {
                                const cfg = shiftConfig['2'];
                                // นำ cfg.icon ออก
                                html += `<div class="time-badge ${cfg.cssClass}">${cfg.label}</div>`;
                            }
                            html += `</td>`;
                        });
                        html += `</tr>`;
                    }
                }

                if (html === "") {
                    html = `<tr><td colspan="6" style="text-align:center; color:#888;">ไม่พบข้อมูลตารางเวร</td></tr>`;
                }

                tableBody.innerHTML = html;

            } catch (error) {
                console.error("Error loading schedule:", error);
                tableBody.innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;">โหลดข้อมูลไม่สำเร็จ</td></tr>`;
            }
        }
    </script>

</body>

</html>
