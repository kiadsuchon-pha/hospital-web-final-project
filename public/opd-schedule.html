<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางเวลาทำการ (OPD) - HOSPITAL CARE</title>

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style-opd.css">
</head>

<body>

    <nav>
        <div class="container">
            <div class="logo"><i class="fa-solid fa-heart-pulse"></i> HOSPITAL CARE</div>
            <div class="nav-links">
                <a href="index.html">หน้าหลัก</a>
                <a href="index.html#services">บริการ</a>
                <a href="doctors.html">ค้นหาแพทย์</a>
                <a href="opd-schedule.html" style="color: var(--primary); font-weight:bold;">ตารางเวร</a>
                <a href="index.html#contact">ติดต่อ</a>
            </div>
        </div>
    </nav>

    <div class="page-container">

        <div class="page-header">
            <div>
                <h1>ตารางเวลาทำการแผนก (OPD Schedule)</h1>
                <p style="color:#666; margin:5px 0 0 20px;">ตรวจสอบวันและเวลาทำการของแต่ละศูนย์รักษา <span
                        id="lastUpdatedText" style="color:var(--primary); font-weight: 600; margin-left: 5px;"></span>
                </p>
            </div>

            <a href="doctor-schedule.html" class="btn-doctor-search">
                <i class="fa-solid fa-user-doctor"></i> ตารางแพทย์ออกตรวจ (รายบุคคล)
            </a>
        </div>

        <div class="filter-section">
            <select id="filterDay" class="form-control">
                <option value="">-- ทุกวัน --</option>
                <option value="จันทร์">จันทร์</option>
                <option value="อังคาร">อังคาร</option>
                <option value="พุธ">พุธ</option>
                <option value="พฤหัส">พฤหัส</option>
                <option value="ศุกร์">ศุกร์</option>
            </select>
            <select id="filterDepartment" class="form-control">
                <option value="">-- ทุกแผนก --</option>
            </select>
            <select id="filterLocation" class="form-control">
                <option value="">-- ทุกสถานที่ --</option>
            </select>
        </div>

        <div class="table-responsive">
            <table class="opd-table">
                <thead>
                    <tr>
                        <th style="width: 250px;">แผนก / วัน</th>
                        <th>จันทร์</th>
                        <th>อังคาร</th>
                        <th>พุธ</th>
                        <th>พฤหัส</th>
                        <th>ศุกร์</th>
                    </tr>
                </thead>
                <tbody id="opdTableBody">
                    <tr>
                        <td colspan="6" style="padding:50px; text-align:center;">⏳ กำลังโหลดข้อมูล...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script type="module">
        import { collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { db } from "./js/firebase-config.js";

        // ตัวแปรส่วนกลางเก็บข้อมูลทั้งหมดเพื่อกรองแบบ Real-time
        let allGroupedData = {}; 

        window.onload = loadOPDSchedule;

        async function loadOPDSchedule() {
            const tableBody = document.getElementById('opdTableBody');

            // 1. ดึงข้อมูลบันทึกการแก้ไขล่าสุด (Audit Log)
            try {
                const logQ = query(collection(db, "audit_logs"), orderBy("timestamp", "desc"), limit(1));
                const logSnap = await getDocs(logQ);
                if (!logSnap.empty) {
                    const latestLog = logSnap.docs[0].data();
                    const dateObj = new Date(latestLog.timestamp);
                    const dateStr = dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                    document.getElementById('lastUpdatedText').innerText = `(อัปเดตล่าสุด: ${dateStr})`;
                }
            } catch (logError) {
                console.error("ไม่สามารถดึงเวลาอัปเดตล่าสุดได้:", logError);
            }

            // 2. ดึงข้อมูล Departments, OPD Schedules, และ Locations จาก Firestore
            try {
                const [deptSnap, opdSnap, locSnap] = await Promise.all([
                    getDocs(collection(db, "departments")),
                    getDocs(collection(db, "opd_schedules")),
                    getDocs(collection(db, "locations"))
                ]);

                const locsMap = {};
                const filterLoc = document.getElementById('filterLocation');
                locSnap.forEach(doc => {
                    locsMap[doc.id] = doc.data().name;
                    filterLoc.add(new Option(doc.data().name, doc.id)); // เพิ่มรายชื่อลง Dropdown ตัวกรอง
                });

                let deptsMap = {};
                const filterDept = document.getElementById('filterDepartment');
                deptSnap.forEach(doc => {
                    if (doc.data().is_active !== false) {
                        deptsMap[doc.id] = doc.data();
                        filterDept.add(new Option(doc.data().name, doc.id)); // เพิ่มรายชื่อลง Dropdown ตัวกรอง
                    }
                });

                if (Object.keys(deptsMap).length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">ไม่พบข้อมูลแผนก</td></tr>`;
                    return;
                }

                const groupedData = {};

                opdSnap.forEach(doc => {
                    const d = doc.data();
                    if (d.active === false) return;

                    const locId = d.location_id;
                    const deptId = d.dept_id;
                    const day = d.day;
                    const shift = String(d.shift);

                    if (!locId || !deptId || !deptsMap[deptId]) return;

                    if (!groupedData[locId]) {
                        groupedData[locId] = {
                            name: locsMap[locId] || "ไม่ระบุสถานที่",
                            departments: {}
                        };
                    }

                    if (!groupedData[locId].departments[deptId]) {
                        groupedData[locId].departments[deptId] = {
                            name: deptsMap[deptId].name,
                            icon: deptsMap[deptId].icon || 'fa-hospital',
                            schedules: {
                                "จันทร์": { '1': false, '2': false },
                                "อังคาร": { '1': false, '2': false },
                                "พุธ": { '1': false, '2': false },
                                "พฤหัส": { '1': false, '2': false },
                                "ศุกร์": { '1': false, '2': false }
                            }
                        };
                    }

                    if (groupedData[locId].departments[deptId].schedules[day]) {
                        groupedData[locId].departments[deptId].schedules[day][shift] = true;
                    }
                });

                allGroupedData = groupedData;

                // ผูก Event Listeners สำหรับดักจับการเปลี่ยนแปลงตัวกรอง
                document.getElementById('filterLocation').addEventListener('change', renderFilteredTable);
                document.getElementById('filterDepartment').addEventListener('change', renderFilteredTable);
                document.getElementById('filterDay').addEventListener('change', renderFilteredTable);

                // แสดงตารางข้อมูลรอบแรก
                renderFilteredTable();

            } catch (error) {
                console.error("Error loading schedule:", error);
                tableBody.innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;">โหลดข้อมูลไม่สำเร็จ</td></tr>`;
            }
        }

        // ฟังก์ชัน Render ตารางหลังผ่านเงื่อนไข Filter
        function renderFilteredTable() {
            const selLoc = document.getElementById('filterLocation').value;
            const selDept = document.getElementById('filterDepartment').value;
            const selDay = document.getElementById('filterDay').value;
            
            const tableBody = document.getElementById('opdTableBody');
            let html = "";
            const days = ["จันทร์", "อังคาร", "พุธ", "พฤหัส", "ศุกร์"];

            const shiftConfig = {
                '1': { label: '08:00 - 12:00', cssClass: 'morning' },
                '2': { label: '13:00 - 16:00', cssClass: 'afternoon' }
            };

            for (const locId in allGroupedData) {
                if (selLoc && locId !== selLoc) continue; // กรองสถานที่

                const location = allGroupedData[locId];
                let locationHtml = "";
                let deptCount = 0;

                for (const deptId in location.departments) {
                    if (selDept && deptId !== selDept) continue; // กรองแผนก

                    const dept = location.departments[deptId];

                    if (selDay) { // กรองวันทำงานของแผนก
                        if (!dept.schedules[selDay]['1'] && !dept.schedules[selDay]['2']) continue;
                    }

                    deptCount++;
                    locationHtml += `<tr>`;
                    locationHtml += `<td rowspan="2" class="dept-cell" style="vertical-align: middle;">
                                        <div style="display:flex; align-items:center;">
                                            <div class="dept-icon-wrapper"><i class="fa-solid ${dept.icon}"></i></div>
                                            ${dept.name}
                                        </div>
                                     </td>`;

                    // คอลัมน์ช่วงเช้า (Shift 1)
                    days.forEach(day => {
                        locationHtml += `<td>`;
                        if ((!selDay || selDay === day) && dept.schedules[day]['1']) {
                            const cfg = shiftConfig['1'];
                            locationHtml += `<div class="time-badge ${cfg.cssClass}">${cfg.label}</div>`;
                        }
                        locationHtml += `</td>`;
                    });
                    locationHtml += `</tr>`;

                    // คอลัมน์ช่วงบ่าย (Shift 2)
                    locationHtml += `<tr class="afternoon-row">`;
                    days.forEach(day => {
                        locationHtml += `<td>`;
                        if ((!selDay || selDay === day) && dept.schedules[day]['2']) {
                            const cfg = shiftConfig['2'];
                            locationHtml += `<div class="time-badge ${cfg.cssClass}">${cfg.label}</div>`;
                        }
                        locationHtml += `</td>`;
                    });
                    locationHtml += `</tr>`;
                }

                // แปะชื่อหัวข้อสถานที่ถ้ามีข้อมูลแผนกข้างในหลงเหลืออยู่หลังกรอง
                if (deptCount > 0) {
                    html += `<tr style="background-color: #fdfdfd;">
                                <td class="dept-cell location-empty-cell"></td>
                                <td colspan="5" style="text-align: center; font-weight: bold; color: var(--white);background: var(--primary); padding: 10px; font-size: 1.1rem; border-bottom: 2px solid #f0f4f8;">
                                    <i class="fa-solid fa-location-dot"></i> ${location.name}
                                </td>
                             </tr>`;
                    html += locationHtml;
                }
            }

            if (html === "") {
                html = `<tr><td colspan="6" style="text-align:center; padding:50px; color:#888;">ไม่พบข้อมูลตารางเวรที่ตรงกับเงื่อนไข</td></tr>`;
            }

            tableBody.innerHTML = html;
        }
    </script>

</body>

</html>
